# Copy to secrets.yaml (git-ignored) and fill in your own values.
wifi_ssid: "your-wifi-name"
wifi_password: "your-wifi-password"
# Any long random string; protects over-the-air updates (openssl rand -hex 16).
ota_password: "change-me"
# MQTT broker Nidoo reads discovery from.
mqtt_broker: "192.168.1.91"
mqtt_username: "mqtt-user"
mqtt_password: "mqtt-password"
