<rect x="40" y="650" width="1040" height="104" rx="12" fill="#1a1410" stroke="#e5484d" stroke-opacity="0.5"/>
<text x="60.0" y="674.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#ffb3b5" text-anchor="start" font-weight="700" >Why VIN and not 3.3 V</text>
<text x="60.0" y="696.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#c9d1d9" text-anchor="start" font-weight="400" >• Wi-Fi bursts (~300 mA) stay off the Pi's 3.3 V rail, which feeds the SD card.</text>
<text x="60.0" y="715.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#c9d1d9" text-anchor="start" font-weight="400" >• The 5 V pins are the raw input: the ESP32 keeps running while the Pi is halted.</text>
<text x="60.0" y="734.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#c9d1d9" text-anchor="start" font-weight="400" >• The regulator only turns ~0.15 W into heat (≈ 1.5 kWh a year).</text>
