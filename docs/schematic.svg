<text x="454.0" y="504.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e" text-anchor="start" font-weight="400" >GPIO17 (pin 11) low</text>
<text x="454.0" y="521.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e" text-anchor="start" font-weight="400" >→ power key →</text>
